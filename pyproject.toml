[project]
name = "seatcom-model"
version = "0.1.0"
description = "SeatCom 데이터셋 생성·MongoDB 적재·좌석 추천 모델 학습 (uv 단일 환경)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # recommender/seatrec 학습·추론
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "lightgbm>=4.3",
    "threadpoolctl>=3.1",
    # MongoDB 읽기(.env)
    "pymongo>=4.6",
    "python-dotenv>=1",
    # data/libraries/scripts/generate_synthetic.py 진행률
    "tqdm>=4.66",
]

[dependency-groups]
# API 명세 검증(data/scripts/validate_api_spec.py), 데이터프레임 로더(load.py load_df)
dev = ["jsonschema>=4.21", "openapi-spec-validator>=0.7", "pandas>=2.1"]
# 좌석 스크린샷 OCR 구조화(data/scripts/structure_seat_screenshot.py) — 필요할 때만: uv sync --group ocr
ocr = ["rapidocr>=3.10,<4", "opencv-python-headless>=4.10,<6", "onnxruntime>=1.20,<2"]

[tool.uv]
package = false          # 설치형 패키지가 아니라 스크립트·모듈 실행용 환경
default-groups = ["dev"]
