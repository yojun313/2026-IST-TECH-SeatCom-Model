# 좌석 추천 모델 학습 설정 (v1 데이터: synth-1.0)
# 모든 수치·스위치는 여기서 관리한다. 시드는 고정한다.
data_version: v1
generator_version: synth-1.0
seed: 20261114
db: library

paths:
  exports: seat_model/exports/train_v1
  models: seat_model/models
  reports: seat_model/reports

split:
  user_ratios: [0.70, 0.15, 0.15]     # train / val / test, archetype 층화
  room_holdout_count: 4                # 서로 다른 도서관에서 고른다
  time_split_date: "2026-10-01"        # (C) 이 날짜 이전 = 학습, 이후 = 평가(학습 사용자)

data:
  min_available: 2                     # 빈자리 1개 이하 요청 제외
  inf_shrinkage: 3.0                   # 취향 추정 수축: r = Σ(x_chosen - mean_avail) / (n + m0)

eval:
  ks: [1, 3, 5]
  ndcg_k: 5
  grade_cuts: [0.05, 0.20, 0.50]       # U_true 상위 5%=3, 20%=2, 50%=1
  bootstrap: 1000                      # 사용자 단위 재표본(같은 사용자가 여러 요청을 가짐)

clogit:
  l2: 1.0
  maxiter: 300

gbdt:
  optuna_trials: 50
  tune_query_frac: 0.25                # 튜닝은 학습 요청 25% 표본, 검증은 전체
  max_rounds: 600
  early_stopping: 40
  xgb_device: cuda                     # 실패하면 cpu

online:
  prior_var: 1.0                       # 사용자별 계수 사전분산 τ² (기본값; 실제 값은 검증 분할로 고른다)
  prior_var_grid: [0.02, 0.05, 0.1, 0.3, 1.0]
  max_newton_steps: 1                  # 선택 1건마다 뉴턴 1회(가정 밀도 필터)
  retrain_every_days: 7                # 전역 모델 주기 재학습(웜스타트) 간격
  profile_min_sessions: 3              # 추정 취향 프로필을 내보내는 최소 착석 횟수
  profile_min_z: 1.0                   # |평균/표준편차| 이 이상인 항목만 취향으로 보고
