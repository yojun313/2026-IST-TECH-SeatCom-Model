<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · SeatViz</title>
  <script>try{const t=localStorage.getItem('sv-theme');if(t)document.documentElement.dataset.theme=t;else if(matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.dataset.theme='dark'}catch(e){}</script>
  <link rel="stylesheet" href="/static/vendor/fonts.css">
  <link rel="stylesheet" href="/static/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='9' width='26' height='12' rx='3' fill='%232f6f5e'/%3E%3Crect x='8' y='21' width='4' height='7' fill='%232f6f5e'/%3E%3Crect x='20' y='21' width='4' height='7' fill='%232f6f5e'/%3E%3C/svg%3E">
  {% block head %}{% endblock %}
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><i class="fa-solid fa-couch"></i><div>SeatViz<small>SeatCom 데이터셋 뷰어</small></div></div>
    <nav class="nav">
      {% for key, href, icon, label in nav %}
      <a href="{{ href }}" class="{{ 'on' if active == key else '' }}"><i class="fa-solid {{ icon }}"></i>{{ label }}</a>
      {% endfor %}
    </nav>
    <div class="side-foot">
      <button class="btn" id="themeBtn" style="width:100%;justify-content:center"><i class="fa-solid fa-circle-half-stroke"></i>테마</button>
      <p>MongoDB <code>library</code> · 합성 레코드는 <span class="badge b-syn">합성</span>, 실데이터는 <span class="badge b-real">실데이터</span>로 표시합니다.</p>
    </div>
  </aside>
  <main class="main">
    {% block content %}{% endblock %}
  </main>
</div>
<div class="tip" id="tip" hidden></div>
<script src="/static/common.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
